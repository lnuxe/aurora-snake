<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AURORA SNAKE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070a;color:#eaf2ff;
font-family:-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:10px 14px;gap:9px}
#top{display:flex;align-items:center;justify-content:space-between;width:min(92vw,380px)}
#brand{font-size:15px;font-weight:800;letter-spacing:3.5px;
background:linear-gradient(100deg,#5eead4,#818cf8 55%,#f472b6);
-webkit-background-clip:text;background-clip:text;color:transparent}
#topBtns{display:flex;gap:6px}
.icobtn{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:15px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);cursor:pointer}
.icobtn:active{transform:scale(.9);background:rgba(255,255,255,.13)}
#stats{display:flex;gap:7px;width:min(92vw,380px)}
.stat{flex:1;padding:8px 4px;text-align:center;border-radius:14px;
background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s}
.stat.pop{transform:scale(1.13);border-color:#5eead4}
.stat .k{font-size:8.5px;letter-spacing:1.6px;color:#6b7f9a;font-weight:600}
.stat .v{font-size:18px;font-weight:800;color:#5eead4;line-height:1.25}
#wrap{position:relative;width:min(92vw,380px);height:min(92vw,380px);border-radius:22px;
background:rgba(4,8,14,.55);border:1px solid rgba(255,255,255,.09);
overflow:hidden;touch-action:none;transition:box-shadow .3s}
#wrap.hit{box-shadow:0 0 60px rgba(94,234,212,.5);border-color:#5eead4}
#wrap.dead{box-shadow:0 0 70px rgba(248,113,113,.6);border-color:rgba(248,113,113,.7)}
canvas{display:block;width:100%;height:100%}
#combo{position:absolute;top:10px;left:12px;font-size:13px;font-weight:900;color:#fbbf24;opacity:0}
#combo.show{animation:ci .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ci{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.28)}100%{opacity:1;transform:scale(1)}}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
justify-content:center;gap:11px;padding:18px;text-align:center;
background:rgba(5,7,10,.9)}
.overlay.show{display:flex}
.ovTitle{font-size:23px;font-weight:900;
background:linear-gradient(100deg,#5eead4,#818cf8,#f472b6);
-webkit-background-clip:text;background-clip:text;color:transparent}
.ovTitle.rec{background:linear-gradient(100deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text}
.ovSub{font-size:12px;color:#6b7f9a}
.ovStats{display:flex;gap:20px;margin:2px 0 4px}
.ovStats div{font-size:10px;color:#6b7f9a}
.ovStats b{display:block;font-size:19px;color:#5eead4;margin-top:3px}
.btn{padding:12px 30px;border-radius:14px;font-size:13.5px;font-weight:800;
border:none;color:#04110e;cursor:pointer;min-height:46px;
background:linear-gradient(100deg,#5eead4,#818cf8)}
.btn:active{transform:scale(.93)}
.btn.ghost{background:rgba(255,255,255,.055);color:#eaf2ff;border:1px solid rgba(255,255,255,.10)}
#pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,54px);gap:8px}
.padBtn{display:flex;align-items:center;justify-content:center;font-size:19px;border-radius:15px;
background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);cursor:pointer}
.padBtn:active{transform:scale(.9);background:rgba(94,234,212,.26);border-color:#5eead4}
.padBtn.up{grid-column:2;grid-row:1}
.padBtn.left{grid-column:1;grid-row:2}
.padBtn.down{grid-column:2;grid-row:2}
.padBtn.right{grid-column:3;grid-row:2}
#hint{font-size:10.5px;color:#6b7f9a}
.setRow{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.setLabel{font-size:10.5px;color:#6b7f9a;letter-spacing:1px;font-weight:700}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{flex:1;min-width:62px;padding:8px 6px;border-radius:10px;font-size:11px;font-weight:700;
text-align:center;cursor:pointer;background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.09);color:#6b7f9a}
.opt.on{background:rgba(94,234,212,.20);border-color:#5eead4;color:#5eead4}
.swatch{display:flex;gap:8px;width:100%}
.sw{flex:1;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="brand">AURORA</div>
    <div id="topBtns">
      <div class="icobtn" id="pauseBtn" onclick="togglePause()">⏸</div>
      <div class="icobtn" onclick="openSettings()">⚙</div>
    </div>
  </div>
  <div id="stats">
    <div class="stat" id="stScore"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
    <div class="stat" id="stBest"><div class="k">BEST</div><div class="v" id="best">0</div></div>
    <div class="stat" id="stLevel"><div class="k">WAVE</div><div class="v" id="level">1</div></div>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="combo"></div>
    <div class="overlay" id="over">
      <div class="ovTitle" id="overTitle">GAME OVER</div>
      <div class="ovSub" id="overSub"></div>
      <div class="ovStats">
        <div>得分<b id="ovScore">0</b></div>
        <div>最高<b id="ovBest">0</b></div>
        <div>长度<b id="ovLen">3</b></div>
      </div>
      <button class="btn" onclick="restart()">再来一局</button>
    </div>
    <div class="overlay" id="settings">
      <div class="ovTitle" style="font-size:19px">自定义</div>
      <div id="setBody" style="width:100%;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:11px"></div>
      <button class="btn ghost" onclick="closeSettings()">完成</button>
    </div>
  </div>
  <div id="pad">
    <div class="padBtn up" onclick="turn('up')">▲</div>
    <div class="padBtn left" onclick="turn('left')">◀</div>
    <div class="padBtn down" onclick="turn('down')">▼</div>
    <div class="padBtn right" onclick="turn('right')">▶</div>
  </div>
  <div id="hint">滑动转向 · 长按屏幕可加速</div>
</div>
<script>
var THEMES={
  aurora:{name:'极光',snake:['#5eead4','#818cf8'],food:'#f472b6',accent:'#5eead4'},
  ember:{name:'余烬',snake:['#fbbf24','#ef4444'],food:'#fb923c',accent:'#fbbf24'},
  ocean:{name:'深海',snake:['#38bdf8','#6366f1'],food:'#22d3ee',accent:'#38bdf8'},
  mono:{name:'墨白',snake:['#f4f4f5','#a1a1aa'],food:'#fafafa',accent:'#f4f4f5'},
  sakura:{name:'樱',snake:['#f9a8d4','#c084fc'],food:'#fb7185',accent:'#f9a8d4'}
};
var CFG={theme:'aurora',grid:17,speed:200,shake:true};
try{var s=localStorage.getItem('aurora_cfg');if(s){var o=JSON.parse(s);for(var k in o)if(CFG.hasOwnProperty(k))CFG[k]=o[k];}}catch(e){}
function saveCfg(){try{localStorage.setItem('aurora_cfg',JSON.stringify(CFG));}catch(e){}}

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var bgC=document.createElement('canvas'),bgX=bgC.getContext('2d');
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level');
var stScore=document.getElementById('stScore'),stBest=document.getElementById('stBest'),stLevel=document.getElementById('stLevel');
var overEl=document.getElementById('over'),overTitle=document.getElementById('overTitle'),overSub=document.getElementById('overSub');
var ovScoreEl=document.getElementById('ovScore'),ovBestEl=document.getElementById('ovBest'),ovLenEl=document.getElementById('ovLen');
var wrapEl=document.getElementById('wrap'),comboEl=document.getElementById('combo');
var pauseBtn=document.getElementById('pauseBtn'),settingsEl=document.getElementById('settings'),setBody=document.getElementById('setBody');

var GRID=CFG.grid,snake,dir,nextDir,food,score,best,alive,cell,speed,paused=false;
var lastTime=0,acc=0,foodPulse=0,deathFlash=0,shakeTrauma=0,shakeT=0;
var comboCount=0,comboTimer=0,newRecord=false,wave=1,boosting=false;
try{best=parseInt(localStorage.getItem('aurora_best')||'0')||0;}catch(e){best=0;}
bestEl.textContent=best;

function fit(){
  var s=Math.min(wrapEl.clientWidth,wrapEl.clientHeight);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=s*dpr;cv.height=s*dpr;cv.style.width=s+'px';cv.style.height=s+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bgC.width=s*dpr;bgC.height=s*dpr;bgX.setTransform(dpr,0,0,dpr,0,0);
  cell=s/GRID;buildBg(s);
}
function buildBg(s){
  bgX.clearRect(0,0,s,s);
  bgX.strokeStyle='rgba(94,234,212,.075)';bgX.lineWidth=1;
  for(var i=1;i<GRID;i++){
    bgX.beginPath();bgX.moveTo(i*cell,0);bgX.lineTo(i*cell,s);bgX.stroke();
    bgX.beginPath();bgX.moveTo(0,i*cell);bgX.lineTo(s,i*cell);bgX.stroke();
  }
}
function applyTheme(){
  var th=THEMES[CFG.theme];
  document.documentElement.style.setProperty('--ac',th.accent);
  document.body.style.background='#05070a';
  fit();
}

function addTrauma(v){if(!CFG.shake)return;shakeTrauma=Math.min(1,shakeTrauma+v);}
function popCard(el){el.classList.add('pop');setTimeout(function(){el.classList.remove('pop');},230);}
function showCombo(n){
  comboEl.textContent='×'+n+' COMBO';
  comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show');
  setTimeout(function(){comboEl.classList.remove('show');},1100);
}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

function init(){
  GRID=CFG.grid;speed=CFG.speed;
  var mid=Math.floor(GRID/2);
  snake=[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;alive=true;paused=false;wave=1;
  deathFlash=0;shakeTrauma=0;comboCount=0;comboTimer=0;newRecord=false;boosting=false;
  overEl.classList.remove('show');wrapEl.classList.remove('hit','dead');
  scoreEl.textContent='0';levelEl.textContent='1';pauseBtn.textContent='⏸';
  placeFood();acc=0;lastTime=0;fit();
  requestAnimationFrame(loop);
}
function placeFood(){
  var empty=[];
  for(var y=0;y<GRID;y++)for(var x=0;x<GRID;x++){
    var hit=false;
    for(var i=0;i<snake.length;i++)if(snake[i].x===x&&snake[i].y===y){hit=true;break;}
    if(!hit)empty.push({x:x,y:y});
  }
  food=empty.length?empty[Math.floor(Math.random()*empty.length)]:null;
}

function loop(ts){
  if(!alive){draw();requestAnimationFrame(loop);return;}
  if(!lastTime)lastTime=ts;
  var dt=Math.min(ts-lastTime,100);lastTime=ts;
  if(!paused){
    var cur=speed;
    if(boosting)cur=Math.max(60,speed*0.55);
    acc+=dt;
    while(acc>=cur){acc-=cur;step();if(!alive)break;}
    if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboCount=0;}
  }
  foodPulse+=dt*0.005;
  if(deathFlash>0)deathFlash=Math.max(0,deathFlash-dt*0.0022);
  if(shakeTrauma>0){shakeTrauma=Math.max(0,shakeTrauma-dt*0.0018);shakeT+=dt*0.028;}
  draw();
  requestAnimationFrame(loop);
}

function step(){
  if(!alive||paused)return;
  dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){die('撞墙了');return;}
  for(var i=0;i<snake.length-1;i++)
    if(snake[i].x===head.x&&snake[i].y===head.y){die('咬到自己了');return;}
  snake.unshift(head);
  if(food&&head.x===food.x&&head.y===food.y){
    comboCount++;comboTimer=1800;
    var mult=comboCount>=3?comboCount:1;
    var gain=10*mult;
    score+=gain;scoreEl.textContent=score;popCard(stScore);
    addTrauma(0.26);vibrate(16);
    wrapEl.classList.add('hit');setTimeout(function(){wrapEl.classList.remove('hit');},150);
    if(comboCount>=3)showCombo(comboCount);
    if(score>best){
      if(!newRecord&&best>0)vibrate([15,25,15]);
      best=score;bestEl.textContent=best;popCard(stBest);newRecord=true;
      try{localStorage.setItem('aurora_best',String(best));}catch(e){}
    }
    var nw=Math.floor(score/80)+1;
    if(nw!==wave){wave=nw;levelEl.textContent=wave;popCard(stLevel);
      speed=Math.max(85,CFG.speed-(wave-1)*14);}
    placeFood();
  }else{snake.pop();}
}

function die(reason){
  alive=false;addTrauma(1);deathFlash=1;vibrate([35,45,70]);
  wrapEl.classList.add('dead');
  overTitle.textContent=newRecord?'NEW RECORD':'GAME OVER';
  overTitle.className='ovTitle'+(newRecord?' rec':'');
  overSub.textContent=reason;
  ovScoreEl.textContent=score;ovBestEl.textContent=best;ovLenEl.textContent=snake.length;
  setTimeout(function(){overEl.classList.add('show');},280);
}

function draw(){
  if(!cell)return;
  var s=cell*GRID,th=THEMES[CFG.theme];
  ctx.clearRect(0,0,s,s);
  ctx.drawImage(bgC,0,0,s,s);
  var ox=0,oy=0;
  if(shakeTrauma>0){
    var sh=shakeTrauma*shakeTrauma;
    ox=Math.sin(shakeT*1.7)*6*sh;oy=Math.sin(shakeT*2.3)*4.5*sh;
  }
  ctx.save();ctx.translate(ox,oy);
  // 食物
  if(food){
    var fx=food.x*cell+cell/2,fy=food.y*cell+cell/2;
    var pr=cell*0.32*(1+Math.sin(foodPulse)*0.15);
    ctx.globalAlpha=0.28;ctx.fillStyle=th.food;
    ctx.beginPath();ctx.arc(fx,fy,pr*2.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle=th.food;
    ctx.beginPath();ctx.arc(fx,fy,pr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.62)';
    ctx.beginPath();ctx.arc(fx-pr*0.3,fy-pr*0.3,pr*0.3,0,Math.PI*2);ctx.fill();
  }
  // 蛇
  var n=snake.length,c0=th.snake[0],c1=th.snake[1];
  for(var j=n-1;j>=0;j--){
    var seg=snake[j],t=j/Math.max(1,n-1);
    var col=lerpColor(c0,c1,t);
    var pad=cell*0.10,shrink=j===0?0:cell*0.018;
    var rad=cell*(j===0?0.30:0.22);
    ctx.fillStyle=col;
    if(j===0){ctx.shadowBlur=16;ctx.shadowColor=c0;}
    roundRect(seg.x*cell+pad+shrink,seg.y*cell+pad+shrink,
              cell-pad*2-shrink*2,cell-pad*2-shrink*2,rad);
    ctx.fill();ctx.shadowBlur=0;
    if(j===0){
      var ex=seg.x*cell+cell/2,ey=seg.y*cell+cell/2;
      var eo=cell*0.14,er=cell*0.085;
      var px=dir.y!==0?eo:0,py=dir.x!==0?eo:0;
      ctx.fillStyle='rgba(5,7,10,.88)';
      ctx.beginPath();ctx.arc(ex-px,ey-py,er,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex+px,ey+py,er,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
  if(deathFlash>0){
    ctx.fillStyle='rgba(248,113,113,'+(deathFlash*0.30)+')';
    ctx.fillRect(0,0,s,s);
  }
}
function hex2rgb(h){
  h=h.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function lerpColor(a,b,t){
  var A=hex2rgb(a),B=hex2rgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+
                 Math.round(A[1]+(B[1]-A[1])*t)+','+
                 Math.round(A[2]+(B[2]-A[2])*t)+')';
}
function roundRect(x,y,w,h,r){
  if(w<0||h<0)return;
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function turn(d){
  if(!alive||paused)return;
  if(d==='up'&&dir.y===0)nextDir={x:0,y:-1};
  else if(d==='down'&&dir.y===0)nextDir={x:0,y:1};
  else if(d==='left'&&dir.x===0)nextDir={x:-1,y:0};
  else if(d==='right'&&dir.x===0)nextDir={x:1,y:0};
}
function togglePause(){
  if(!alive)return;
  paused=!paused;pauseBtn.textContent=paused?'▶':'⏸';
  if(paused)lastTime=0;
}
function restart(){init();}

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='w'){e.preventDefault();turn('up');}
  else if(k==='ArrowDown'||k==='s'){e.preventDefault();turn('down');}
  else if(k==='ArrowLeft'||k==='a'){e.preventDefault();turn('left');}
  else if(k==='ArrowRight'||k==='d'){e.preventDefault();turn('right');}
  else if(k===' '){e.preventDefault();togglePause();}
});

var sx=0,sy=0,touching=false,turnedInSwipe=false,longPressTimer=null;
wrapEl.addEventListener('touchstart',function(e){
  var t=e.touches[0];sx=t.clientX;sy=t.clientY;touching=true;turnedInSwipe=false;
  longPressTimer=setTimeout(function(){if(touching&&alive&&!paused)boosting=true;},260);
},{passive:true});
wrapEl.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!touching||turnedInSwipe)return;
  var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<22&&Math.abs(dy)<22)return;
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
  boosting=false;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?'right':'left');
  else turn(dy>0?'down':'up');
  turnedInSwipe=true;sx=t.clientX;sy=t.clientY;
  setTimeout(function(){turnedInSwipe=false;},55);
},{passive:false});
wrapEl.addEventListener('touchend',function(e){
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
  boosting=false;
  if(!touching)return;touching=false;
  if(turnedInSwipe)return;
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?'right':'left');
  else turn(dy>0?'down':'up');
},{passive:true});

function buildSettings(){
  var h='';
  h+='<div class="setRow"><div class="setLabel">主题皮肤</div><div class="swatch">';
  Object.keys(THEMES).forEach(function(k){
    var th=THEMES[k];
    h+='<div class="sw'+(CFG.theme===k?' on':'')+'" onclick="pickTheme(\''+k+'\')" style="background:linear-gradient(120deg,'+th.snake[0]+','+th.snake[1]+','+th.food+')"></div>';
  });
  h+='</div></div>';
  h+='<div class="setRow"><div class="setLabel">棋盘尺寸</div><div class="opts">';
  [13,17,21].forEach(function(g){
    h+='<div class="opt'+(CFG.grid===g?' on':'')+'" onclick="pickGrid('+g+')">'+g+'×'+g+'</div>';
  });
  h+='</div></div>';
  h+='<div class="setRow"><div class="setLabel">初始速度</div><div class="opts">';
  [{v:260,n:'悠闲'},{v:200,n:'标准'},{v:150,n:'疾速'}].forEach(function(o){
    h+='<div class="opt'+(CFG.speed===o.v?' on':'')+'" onclick="pickSpeed('+o.v+')">'+o.n+'</div>';
  });
  h+='</div></div>';
  h+='<div class="setRow"><div class="setLabel">效果</div><div class="opts">';
  h+='<div class="opt'+(CFG.shake?' on':'')+'" onclick="toggleShake()">震屏 '+(CFG.shake?'开':'关')+'</div>';
  h+='</div></div>';
  setBody.innerHTML=h;
}
function openSettings(){buildSettings();settingsEl.classList.add('show');if(alive)paused=true;pauseBtn.textContent='▶';}
function closeSettings(){settingsEl.classList.remove('show');if(alive){paused=false;lastTime=0;pauseBtn.textContent='⏸';}}
function pickTheme(k){CFG.theme=k;saveCfg();applyTheme();buildSettings();}
function pickGrid(g){CFG.grid=g;saveCfg();buildSettings();restart();}
function pickSpeed(v){CFG.speed=v;saveCfg();buildSettings();}
function toggleShake(){CFG.shake=!CFG.shake;saveCfg();buildSettings();}

applyTheme();init();
